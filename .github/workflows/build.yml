name: Build and Deploy Site

on:
  push:
    paths:
      - "data/players.json"
      - "data/config/**"
      - "generate.py"
      - "scripts/validate_data.py"

# Cancel in-progress runs when a new commit is pushed
# This prevents race conditions and avoids failure emails
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate player data
        run: python scripts/validate_data.py

      - name: Run script to generate HTML
        run: python generate.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Commit and push changes
        run: |
          git add events/ courses/ index.html data/players.json || true
          git diff --staged --quiet && echo "No changes to commit." && exit 0
          git commit -m "Auto-update site from player data"
          # Pull with rebase to handle any concurrent commits, then push
          git pull --rebase origin main
          git push
