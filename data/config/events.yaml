# Event definitions for Pokeathlon
# Each event has a scoring formula that converts raw score to points (max 200)

events:
  hurdle-dash:
    display_name: "Hurdle Dash"
    unit: "seconds"
    decimal_places: 1
    lower_is_better: true
    formula: "floor(11500 / score)"
    max_points: 200
    latex: '\left\lfloor \frac{11500}{\text{score}} \right\rfloor'
    output: "events/hurdle-dash.html"
    has_page: true

  pennant-capture:
    display_name: "Pennant Capture"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "score * 3"
    max_points: 200
    latex: '\text{score} \times 3'
    output: "events/pennant-capture.html"
    has_page: true

  circle-push:
    display_name: "Circle Push"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "score * 3"
    max_points: 200
    latex: '\text{score} \times 3'
    output: null
    has_page: false
    fixed_record:
      player: "-"
      score: 66
      points: 198
      date: "2009-09-12"

  block-smash:
    display_name: "Block Smash"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "score"
    max_points: 200
    latex: '\text{score}'
    output: "events/block-smash.html"
    has_page: true

  disc-catch:
    display_name: "Disc Catch"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "150 - (1500 / (score + 12.5))"
    max_points: 200
    latex: '150 - \frac{1500}{\text{score} + 12.5}'
    output: "events/disc-catch.html"
    has_page: true

  lamp-jump:
    display_name: "Lamp Jump"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "floor(score / 3.5)"
    max_points: 200
    latex: '\left\lfloor \frac{\text{score}}{3.5} \right\rfloor'
    output: "events/lamp-jump.html"
    has_page: true

  relay-run:
    display_name: "Relay Run"
    unit: "laps"
    decimal_places: 1
    lower_is_better: false
    formula: "score * 10"
    max_points: 200
    latex: '\text{score} \times 10'
    output: "events/relay-run.html"
    has_page: true

  ring-drop:
    display_name: "Ring Drop"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "score * 1.5"
    max_points: 200
    latex: '\text{score} \times 1.5'
    output: null
    has_page: false
    fixed_record:
      player: "-"
      score: 200
      points: 200
      date: "2009-09-12"

  snow-throw:
    display_name: "Snow Throw"
    unit: "count"
    decimal_places: 0
    lower_is_better: false
    formula: "score * 3"
    max_points: 200
    latex: '\text{score} \times 3'
    output: "events/snow-throw.html"
    has_page: true

  goal-roll:
    display_name: "Goal Roll"
    unit: "goals"
    decimal_places: 0
    lower_is_better: false
    formula: "100 + (score * 5)"
    max_points: 200
    latex: '\text{position points} + \text{score} \times 5'
    output: "events/goal-roll.html"
    has_page: true
    notes: "Position points: 100-80-70-60"
